title: AgentCo
description: >-
  A contract in the middle, a coordination plane on one side, an execution
  runtime on the other — notes on running more than one agent.
url: "https://agentic-co.github.io"
baseurl: ""
author:
  name: Marcelo Bidoli Fernandes
  github: mabidoli

# Default social card. jekyll-seo-tag emits it as og:image / twitter:image;
# a post can override with `image:` in its front matter.
image: /assets/brand/og.png
twitter:
  card: summary_large_image

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

markdown: kramdown
permalink: /:title/
exclude: [README.md, Gemfile, Gemfile.lock, vendor]
