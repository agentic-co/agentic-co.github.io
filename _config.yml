title: Agentic Co
description: >-
  A contract in the middle, a coordination plane on one side, an execution
  runtime on the other — notes on running more than one agent.
url: "https://agentic-co.github.io"
baseurl: ""
author:
  name: Marcelo Bidoli Fernandes
  github: mabidoli

# Default social card. jekyll-seo-tag reads `page.image`, NOT a site-level
# `image:` key — setting it at the top level emits nothing at all, silently.
# A `defaults` block puts it on every page instead, and seo-tag upgrades the
# Twitter card to summary_large_image on its own once an image is present.
# A post overrides it with `image:` in its own front matter.
defaults:
  - scope:
      path: ""
    values:
      image: /assets/brand/og.png

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

markdown: kramdown
permalink: /:title/
exclude: [README.md, Gemfile, Gemfile.lock, vendor]
